plugins {
    id "com.android.application"
}

// Signature : si les secrets GitHub SYRIUS_KEYSTORE_* existent, l'APK est signé avec ta clé
// (les mises à jour s'installent par-dessus). Sinon, clé de test (désinstaller avant mise à jour).
def ks = System.getenv("SYRIUS_KEYSTORE_FILE")
// Adresse de ton Syrius : ses liens (invitations, essais) ouvrent directement l'application.
def syriusUrl = System.getenv("SYRIUS_URL") ?: ""
def linkHost = syriusUrl.replaceFirst(/^https?:\/\//, "").replaceFirst(/[\/:?#].*$/, "")
if (!(linkHost ==~ /[A-Za-z0-9.-]+/)) linkHost = "syrius.invalid"

android {
    namespace "fr.syrius.app"
    compileSdk 36

    defaultConfig {
        applicationId "fr.syrius.app"
        minSdk 26
        targetSdk 36  // exigence Google Play (Android 16)
        versionCode Integer.parseInt(System.getenv("SYRIUS_VERSION_CODE") ?: "1")
        versionName "1.0." + (System.getenv("SYRIUS_VERSION_CODE") ?: "1")
        // Adresse de ton Syrius, pré-remplie au premier lancement (variable GitHub SYRIUS_URL).
        buildConfigField "String", "DEFAULT_URL", "\"" + syriusUrl + "\""
        manifestPlaceholders = [linkHost: linkHost]
        // Téléphones Android 64 bits (ARM) uniquement : application plus légère.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv("SYRIUS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("SYRIUS_KEY_ALIAS")
                keyPassword System.getenv("SYRIUS_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // IA hors ligne (Google MediaPipe, open source Apache 2.0) — version épinglée.
    implementation "com.google.mediapipe:tasks-genai:0.10.27"
    // Vision hors ligne (Google LiteRT-LM, open source Apache 2.0) — version épinglée.
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
    // Génération d'images hors ligne : libMNN.so + libsyrius_sd.so compilées par la CI depuis des
    // sources épinglées (android/native/build.sh) et placées dans src/main/jniLibs.
    // Photo pour la vision (partage sécurisé du fichier avec l'appareil photo)
    implementation "androidx.core:core:1.13.1"
    // « Hey Syrius » : reconnaissance vocale hors ligne Vosk (Apache 2.0) — versions épinglées.
    implementation "com.alphacephei:vosk-android:0.3.47@aar"
    implementation "net.java.dev.jna:jna:5.13.0@aar"
}
