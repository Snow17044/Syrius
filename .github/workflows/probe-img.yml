name: Vérification ponctuelle (images)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-img.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fournisseurs Hugging Face pour la création d'images
        run: |
          for m in black-forest-labs/FLUX.1-schnell black-forest-labs/FLUX.1-dev stabilityai/stable-diffusion-xl-base-1.0 Qwen/Qwen-Image tencent/HunyuanImage-2.1 ; do
            echo "== $m"
            curl -sS -m 20 "https://huggingface.co/api/models/$m?expand%5B%5D=inferenceProviderMapping" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); m=d.get('inferenceProviderMapping') or {}
          items = m.items() if isinstance(m, dict) else [(x.get('provider'), x) for x in m]
          for k,v in items: print('  ', k, v.get('providerId'), v.get('status'), v.get('task'))
          " || true
          done
      - name: Routes (sans clé : 401 = existe, 404 = n'existe pas)
        run: |
          for u in hf-inference/models/black-forest-labs/FLUX.1-schnell nebius/v1/images/generations together/v1/images/generations fal-ai/fal-ai/flux/schnell replicate/v1/models/black-forest-labs/flux-schnell/predictions nscale/v1/images/generations wavespeed/api/v3/wavespeed-ai/flux-schnell; do
            curl -sS -m 20 -o /tmp/o -w "$u -> %{http_code} " -X POST -H 'Content-Type: application/json' -d '{}' "https://router.huggingface.co/$u"; head -c 120 /tmp/o; echo
          done
      - name: AI Horde (gratuit, anonyme)
        run: |
          curl -sS -m 20 https://aihorde.net/api/v2/status/heartbeat; echo
          curl -sS -m 20 "https://aihorde.net/api/v2/status/models?type=image" | python3 -c "
          import json,sys; d=json.load(sys.stdin); d.sort(key=lambda x:-x.get('count',0))
          for m in d[:8]: print(m['name'], m.get('count'), m.get('queued'), m.get('eta'))"
      - name: Pollinations (avec en-têtes d'un serveur)
        run: |
          curl -sS -m 60 -A "SyriusAssistant/1.0 (assistant personnel)" -H "Accept: image/jpeg,image/png,image/webp" -o /tmp/i -w "anon %{http_code} %{content_type} %{size_download}\n" "https://image.pollinations.ai/prompt/a%20cat?width=768&height=768&seed=5&nologo=true&private=true&safe=true"
          curl -sS -m 20 https://image.pollinations.ai/models; echo
