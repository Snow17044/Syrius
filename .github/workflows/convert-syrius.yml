# Transforme le modèle Syrius entraîné en fichier .litertlm (LiteRT-LM, Google) pour les téléphones,
# puis le publie dans les « Releases » (téléchargé par l'application).
# Automatique : après chaque entraînement de la nuit réussi, la nouvelle version est convertie, publiée et
# annoncée à ton Syrius ; l'application propose alors « Mettre à jour » (empreinte vérifiée sur le téléphone).
name: Convertir l'IA Syrius pour téléphone

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Numéro de l'entraînement (vide = modèle de départ Qwen, pour tester la chaîne)"
        default: ""
      model:
        description: "IA de départ (si pas de numéro d'entraînement) : Qwen/Qwen2.5-0.5B-Instruct ou Qwen/Qwen2.5-1.5B-Instruct"
        default: "Qwen/Qwen2.5-0.5B-Instruct"
      quant:
        description: "Compression : dynamic_wi8_afp32 (qualité) ou dynamic_wi4_afp32 (plus léger)"
        default: "dynamic_wi8_afp32"
  workflow_run:
    workflows: ["Entraîner l'IA Syrius"]
    types: [completed]
    branches: [main]
  push:  # essai de la chaîne sur une branche de travail (modèle de départ)
    branches: ["claude/**"]
    paths: [".github/workflows/convert-syrius.yml", "training/convert-requirements.txt"]

permissions:
  contents: write
  actions: read
  id-token: write  # pour annoncer la nouvelle version à ton Syrius (signature GitHub, aucun secret)

jobs:
  check:  # après un entraînement : y a-t-il vraiment un nouveau modèle ? (pas d'entraînement = rien à faire)
    runs-on: ubuntu-24.04
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts" --jq '[.artifacts[] | select(.name == "syrius-modele" and .expired == false)] | length')
          echo "Modèles trouvés : $n"
          echo "go=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  convert:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      QUANT: ${{ inputs.quant || 'dynamic_wi8_afp32' }}
      BASE_MODEL: ${{ inputs.model || 'Qwen/Qwen2.5-0.5B-Instruct' }}
      SYRIUS_URL: ${{ vars.SYRIUS_URL || 'https://syriusprojet1.vercel.app' }}
      PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
      # Après l'entraînement de la nuit : ce modèle-là. Sur une branche de travail : essai avec le modèle de départ.
      RUN_ID: ${{ inputs.run_id || (github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id)) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Place disque (outils inutiles retirés)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1
          # Mémoire de secours (la conversion d'un modèle de 1,5 milliard de paramètres dépasse les 16 Go)
          sudo swapoff -a || true
          sudo fallocate -l 28G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 >/dev/null && sudo swapon /swapfile2
          free -h

      - name: Modèle Syrius entraîné
        if: env.RUN_ID != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: syrius-modele
          path: build/syrius
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Contrôle qualité avant publication
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p build/prev
          gh release download syrius-ia -p eval-latest.json -D build/prev 2>/dev/null || echo "(pas de version de référence)"
          # Automatique (après l'entraînement de la nuit) : le contrôle est obligatoire.
          req=""; [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && req="--require"
          python3 training/eval_gate.py build/syrius/eval.json build/prev/eval-latest.json $req

      - name: Outils de conversion (versions figées)
        run: |
          python3 -m venv .cvenv
          .cvenv/bin/pip install --quiet -r training/convert-requirements.txt
          .cvenv/bin/pip show litert-torch | head -2

      - name: Conversion en LiteRT-LM
        run: |
          src="build/syrius"
          if [ -z "$RUN_ID" ]; then
            src="$(.cvenv/bin/python -c "from huggingface_hub import snapshot_download as s; print(s('$BASE_MODEL', allow_patterns=['*.json','*.safetensors','merges.txt','vocab.json']))")"
          fi
          .cvenv/bin/python -m litert_torch.generative.export_hf --model "$src" --output_dir out \
            --quantization_recipe "$QUANT" --prefill_lengths 256 --cache_length 1280 \
            --bundle_litert_lm True --use_v2 True --delete_in_memory_params True
          ls -la out
          f=$(ls out/*.litertlm | head -1)
          # taille (0.5b / 1.5b) lue dans le modèle réellement converti
          base=$BASE_MODEL
          [ -n "$RUN_ID" ] && base=$(python3 -c "import json;print(json.load(open('build/syrius/syrius.json'))['base'])")
          size=$(echo "$base" | grep -oiE '[0-9]\.[0-9]b' | head -1 | tr 'A-Z' 'a-z')
          case "$size" in 0.5b|1.5b) ;; *) echo "Taille de modèle inconnue : $base"; exit 1;; esac
          name="syrius-$size-$( [ -z "$RUN_ID" ] && echo base || echo "$RUN_ID" )-$QUANT.litertlm"
          mv "$f" "out/$name"
          sha256sum "out/$name" | tee "out/$name.sha256"
          echo "FILE=out/$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH != 'true'
        with:
          name: syrius-litertlm-essai
          path: out/*.sha256
          retention-days: 3

      - name: Essai rapide du fichier
        run: |
          .cvenv/bin/pip install --quiet litert-lm 2>/dev/null && .cvenv/bin/python - <<'PY' || echo "(essai sur ordinateur indisponible : vérifié sur téléphone)"
          import os, litert_lm
          print("litert_lm", getattr(litert_lm, "__version__", "?"))
          PY

      - name: Publier
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view syrius-ia >/dev/null 2>&1 || gh release create syrius-ia --title "IA Syrius (modèles)" \
            --notes "Fichiers de l'IA Syrius pour l'application (LiteRT-LM). Téléchargés automatiquement par l'app."
          gh release upload syrius-ia "$FILE" "$FILE.sha256" --clobber
          # Résultat du contrôle qualité : référence pour la prochaine nuit
          if [ -f build/syrius/eval.json ]; then
            cp build/syrius/eval.json out/eval-latest.json && gh release upload syrius-ia out/eval-latest.json --clobber
          fi
          # Ménage : on garde les 3 dernières versions + celle inscrite dans l'application (version de départ).
          keep=$(grep -oE 'syrius-1\.5b-[0-9]+-[a-z0-9_]+\.litertlm' android/app/src/main/java/fr/syrius/app/SyriusAI.java | head -1)
          gh release view syrius-ia --json assets --jq '.assets | sort_by(.createdAt) | reverse | .[].name' \
            | grep -E '\.litertlm$' | tail -n +4 | while read -r a; do
              if [ "$a" != "$keep" ]; then
                gh release delete-asset syrius-ia "$a" -y; gh release delete-asset syrius-ia "$a.sha256" -y || true
              fi
            done

      - name: Annoncer la nouvelle version aux téléphones
        if: env.PUBLISH == 'true' && env.RUN_ID != ''
        run: python3 training/report_model.py "$FILE"
