# Chaque nuit : une grande IA gratuite aide à fabriquer des exemples de code VÉRIFIÉS (les tests doivent passer),
# fabrique l'épreuve de confirmation inédite de la nuit, puis mesure combien de bugs du banc d'essai elle répare.
# Tout est gardé dans la publication « coder-data ».
name: Exemples de code pour Aurora

on:
  workflow_dispatch:
  schedule:
    - cron: "47 0 * * *"

permissions:
  contents: write  # publication « coder-data » (exemples et score)
  id-token: write  # identité officielle GitHub pour parler à ton Syrius

jobs:
  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SYRIUS_URL: ${{ vars.SYRIUS_URL || 'https://syriusprojet1.vercel.app' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pytest
      - name: Récupérer les exemples déjà fabriqués
        run: |
          gh release view coder-data >/dev/null 2>&1 || gh release create coder-data --title "Exemples de code (Aurora)" \
            --notes "Fichiers créés automatiquement chaque nuit. Ne rien modifier à la main." --prerelease
          mkdir -p training/data
          gh release download coder-data --pattern coder.jsonl --dir training/data --clobber || true
      - name: Fabriquer et vérifier de nouveaux exemples
        run: .venv/bin/python -m coder.make_data 120
      - name: Vrais exemples (changements que tu as acceptés)
        continue-on-error: true
        run: |
          .venv/bin/python -m coder.real "${{ github.repository }}" training/data/real.jsonl | tee /tmp/real.json || : > training/data/real.jsonl
      - name: Épreuve de confirmation inédite (jamais utilisée pour l'entraînement)
        continue-on-error: true
        run: .venv/bin/python -m coder.confirm make confirm.json && gh release upload coder-data confirm.json --clobber
      - name: Score de la grande IA sur le banc d'essai (référence)
        continue-on-error: true
        run: .venv/bin/python -m coder.bench_run teacher 10 | tee /tmp/teacher.json
      - name: Publier
        run: |
          # GitHub refuse un fichier vide : on ne publie que ce qui contient quelque chose
          for f in training/data/coder.jsonl training/data/real.jsonl; do
            if [ -s "$f" ]; then gh release upload coder-data "$f" --clobber; else echo "($f vide : non publié)"; fi
          done
          [ -f /tmp/teacher.json ] && cp /tmp/teacher.json bench-teacher.json && gh release upload coder-data bench-teacher.json --clobber || true
