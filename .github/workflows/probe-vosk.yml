# Vérification ponctuelle du modèle de reconnaissance vocale hors ligne (lecture seule).
name: Vérifier le modèle Vosk

on:
  push:
    paths: [".github/workflows/probe-vosk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Télécharger et inspecter les modèles français
        run: |
          for m in vosk-model-small-fr-0.22 vosk-model-small-fr-pguyot-0.3; do
            echo "=================== $m"
            curl -sSL -m 300 -o "$m.zip" "https://alphacephei.com/vosk/models/$m.zip" || { echo indisponible; continue; }
            ls -l "$m.zip"; sha256sum "$m.zip"
            unzip -q -o "$m.zip" -d "x_$m" || { echo "zip illisible"; continue; }
            find "x_$m" -maxdepth 3 | head -30
            W=$(find "x_$m" -name words.txt | head -1)
            echo "words.txt: $W ($(wc -l < "$W") mots)"
            grep -iE "^(syrius|sirius|siri|hey|hé|eh|ok|okay|dis|bonjour|salut|jarvis|syri)\b" "$W" | head -20
            echo "--- taille dépliée"; du -sh "x_$m"
          done
      - name: Paquets Maven
        run: |
          for u in com/alphacephei/vosk-android/0.3.47/vosk-android-0.3.47.aar net/java/dev/jna/jna/5.13.0/jna-5.13.0.aar; do
            curl -sS -m 60 -o f "https://repo1.maven.org/maven2/$u" && echo "$u $(stat -c%s f) $(sha256sum f | cut -c1-64)"
          done
