name: Vérification ponctuelle (3D et IA)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-3d.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: IA gratuites OpenRouter capables d'utiliser des outils
        run: |
          cat > /tmp/or.py <<'PY'
          import json, sys
          d = json.load(sys.stdin)["data"]
          for m in d:
              if not m["id"].endswith(":free"):
                  continue
              sp = m.get("supported_parameters") or []
              print(m["id"], "| outils" if "tools" in sp else "| -", "|",
                    ",".join((m.get("architecture") or {}).get("input_modalities") or []), "|", m.get("context_length"),
                    "|", (m.get("description") or "")[:120].replace("\n", " "))
          PY
          curl -sS -m 20 https://openrouter.ai/api/v1/models | python3 /tmp/or.py
