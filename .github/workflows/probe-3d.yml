name: Vérification ponctuelle (3D et IA)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-3d.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Bibliothèque Poly Pizza (documentation de l'API)
        run: |
          for u in https://poly.pizza/docs/api https://poly.pizza/docs https://api.poly.pizza/v1.1/search/car "https://api.poly.pizza/v1/search/car" ; do
            echo "=================== $u"
            curl -sS -m 20 -L -D /tmp/h "$u" -o /tmp/b || true
            head -1 /tmp/h; grep -i "content-type" /tmp/h | head -1
            python3 - <<'PY'
          import re, html
          t = open("/tmp/b", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script[\s\S]*?</script>|<style[\s\S]*?</style>", " ", t)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t))
          t = re.sub(r"\s+", " ", t)
          print(t[:6000])
          PY
          done
