name: Vérification ponctuelle (3D et IA)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-3d.yml", "server/tools/real3d.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Création d'une maquette 3D texturée avec le code de Syrius (sans compte)
        run: |
          python3 - <<'PY'
          import time, sys
          sys.path.insert(0, ".")
          from server.tools import real3d
          t = time.time()
          try:
              glb = real3d.trellis_generate("", "a red vintage sports car")
              print("GLB OK", len(glb), "octets", glb[:4], round(time.time() - t, 1), "s")
          except real3d.Real3DError as e:
              print("Erreur Syrius :", e, round(time.time() - t, 1), "s")
          PY
