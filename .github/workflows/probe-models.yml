name: Vérification des modèles (ponctuelle)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-models.yml", "android/native/**"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construction (Linux) du moteur d'images
        run: set -o pipefail; ./android/native/build.sh linux /tmp/sd 2>&1 | tail -20
      - name: Modèle Stable Diffusion 1.5 (MNN) et empreintes
        run: |
          REPO=taobao-mnn/stable-diffusion-v1-5-mnn-general
          REV=$(curl -sS "https://huggingface.co/api/models/$REPO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "revision $REV"
          mkdir -p /tmp/m && cd /tmp/m
          for f in text_encoder.mnn text_encoder.mnn.weight unet.mnn unet.mnn.weight vae_decoder.mnn vae_decoder.mnn.weight vocab.json merges.txt alphas.txt; do
            curl -sSfL -o "$f" "https://huggingface.co/$REPO/resolve/$REV/$f"
          done
          ls -la; sha256sum *
      - name: Génération de test
        run: |
          pip install -q pillow
          cd /tmp/sd
          for steps in 12; do
            /usr/bin/time -f "%e s, %M Ko max" ./syrius_sd /tmp/m $steps 42 /tmp/out.jpg "a cute cat astronaut floating in space, digital art, highly detailed" 2>&1 | grep -v "^progression" | tail -15
          done
          python3 -c '
          from PIL import Image, ImageStat
          im = Image.open("/tmp/out.jpg"); print(im.size, im.mode)
          st = ImageStat.Stat(im); print("moyenne", [round(x) for x in st.mean], "écart-type", [round(x) for x in st.stddev])
          small = im.convert("L").resize((48, 24))
          chars = " .:-=+*#%@"
          for y in range(24):
              print("".join(chars[small.getpixel((x, y)) * 9 // 255] for x in range(48)))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-test
          path: /tmp/out.jpg
