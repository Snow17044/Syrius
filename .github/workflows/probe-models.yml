# Vérification ponctuelle : quels modèles d'IA embarquée sont téléchargeables librement ?
# (lecture seule : aucune clé, aucune écriture)
name: Vérifier les modèles embarqués

on:
  push:
    paths: [".github/workflows/probe-models.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Lister les fichiers des modèles candidats
        run: |
          for repo in litert-community/Qwen2.5-1.5B-Instruct litert-community/Qwen3-1.7B \
                      litert-community/Gemma3-1B-IT litert-community/Qwen2.5-0.5B-Instruct \
                      litert-community/Qwen3-0.6B; do
            echo "=================== $repo"
            curl -sS -m 30 "https://huggingface.co/api/models/$repo?blobs=true" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          print("gated:", d.get("gated"), "| licence:", (d.get("cardData") or {}).get("license"))
          for s in d.get("siblings", []):
              n = s["rfilename"]
              if n.endswith((".task", ".litertlm", ".bin", ".tflite")):
                  print(f"  {n}  {round((s.get(\"size\") or 0)/1e6)} Mo  sha256={(s.get(\"lfs\") or {}).get(\"sha256\")}")
          ' || echo "  (indisponible)"
          done
      - name: Version de MediaPipe LLM disponible
        run: curl -sS -m 30 https://dl.google.com/dl/android/maven2/com/google/mediapipe/tasks-genai/maven-metadata.xml | tr '<' '\n' | grep -E "^(version|latest|release)>" | tail -8
