name: Vérification des modèles (ponctuelle)
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe-models.yml", "android/native/**"]

permissions:
  contents: read

jobs:
  vision:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Révision et fichiers
        run: |
          curl -sS "https://huggingface.co/api/models/litert-community/InternVL3_5-1B" | python3 -c 'import json,sys; print("revision", json.load(sys.stdin)["sha"])'
      - name: Test de la vision hors ligne (InternVL 3.5 1B)
        run: |
          python3 -m venv /tmp/v && . /tmp/v/bin/activate
          pip install -q "litert-lm==0.19.1" 2>&1 | tail -2 || pip install -q litert-lm 2>&1 | tail -2
          pip show litert-lm | head -3
          curl -sSfL -o /tmp/model.litertlm https://huggingface.co/litert-community/InternVL3_5-1B/resolve/main/model.litertlm
          sha256sum /tmp/model.litertlm
          curl -sSfL -o /tmp/chat.png https://huggingface.co/datasets/huggingface/documentation-images/resolve/main/coco_sample.png
          for q in "Décris cette photo en une phrase, en français." "Combien y a-t-il d'animaux et lesquels ? Réponds en français."; do
            echo "=== $q"
            /usr/bin/time -f "%e s, %M Ko" litert-lm run /tmp/model.litertlm --attachment /tmp/chat.png --prompt "$q" 2>&1 | tail -15
          done
          litert-lm run --help 2>&1 | head -60

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Construction (Linux) du moteur d'images
        run: ./android/native/build.sh linux /tmp/sd 2>&1 | tail -20
      - name: Modèle Stable Diffusion 1.5 (MNN) et empreintes
        run: |
          REPO=taobao-mnn/stable-diffusion-v1-5-mnn-general
          REV=$(curl -sS "https://huggingface.co/api/models/$REPO" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sha"])')
          echo "revision $REV"
          mkdir -p /tmp/m && cd /tmp/m
          for f in text_encoder.mnn text_encoder.mnn.weight unet.mnn unet.mnn.weight vae_decoder.mnn vae_decoder.mnn.weight vocab.json merges.txt alphas.txt; do
            curl -sSfL -o "$f" "https://huggingface.co/$REPO/resolve/$REV/$f"
          done
          ls -la; sha256sum *
      - name: Génération de test
        run: |
          pip install -q pillow
          cd /tmp/sd
          for steps in 10; do
            /usr/bin/time -f "%e s, %M Ko max" ./syrius_sd /tmp/m $steps 42 /tmp/out.jpg "a cute cat astronaut floating in space, digital art, highly detailed" 2>&1 | grep -v "^progression" | tail -15
          done
          python3 -c '
          from PIL import Image, ImageStat
          im = Image.open("/tmp/out.jpg"); print(im.size, im.mode)
          st = ImageStat.Stat(im); print("moyenne", [round(x) for x in st.mean], "écart-type", [round(x) for x in st.stddev])
          small = im.convert("L").resize((48, 24))
          chars = " .:-=+*#%@"
          for y in range(24):
              print("".join(chars[small.getpixel((x, y)) * 9 // 255] for x in range(48)))'
      - uses: actions/upload-artifact@v4
        with:
          name: image-test
          path: /tmp/out.jpg
