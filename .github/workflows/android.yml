# Construit l'application Android de Syrius et la publie dans « Releases ».
# Actions officielles, épinglées par empreinte (commit) pour éviter toute substitution.
name: Application Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.SYRIUS_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.SYRIUS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SYRIUS_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/syrius.jks"
            echo "SYRIUS_KEYSTORE_FILE=$RUNNER_TEMP/syrius.jks" >> "$GITHUB_ENV"
            echo "SYRIUS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          elif [ -f android/keystore/syrius-upload.p12 ] && [ -n "$KEYSTORE_PW" ]; then
            # Clé créée par « Créer la clé de signature Android », chiffrée par le mot de passe secret.
            echo "SYRIUS_KEYSTORE_FILE=$GITHUB_WORKSPACE/android/keystore/syrius-upload.p12" >> "$GITHUB_ENV"
            echo "SYRIUS_KEY_ALIAS=syrius" >> "$GITHUB_ENV"
          fi

      - name: Moteur d'images hors ligne (MNN compilé depuis ses sources épinglées)
        run: |
          export ANDROID_NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          ./android/native/build.sh android android/app/src/main/jniLibs/arm64-v8a

      - name: Construire l'APK
        working-directory: android
        env:
          SYRIUS_URL: ${{ vars.SYRIUS_URL }}
          SYRIUS_VERSION_CODE: ${{ github.run_number }}
          SYRIUS_KEYSTORE_PASSWORD: ${{ secrets.SYRIUS_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Renommer
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Syrius.apk
          cp android/app/build/outputs/bundle/release/app-release.aab Syrius.aab
          sha256sum Syrius.apk Syrius.aab | tee Syrius.apk.sha256

      - name: Empreinte de la clé de signature (publique, pour les liens qui ouvrent l'app)
        env:
          SYRIUS_KEYSTORE_PASSWORD: ${{ secrets.SYRIUS_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "${SYRIUS_KEYSTORE_FILE:-}" ]; then
            echo "Clé de signature : la tienne (secrets GitHub)."
            keytool -list -v -keystore "$SYRIUS_KEYSTORE_FILE" -storepass "$SYRIUS_KEYSTORE_PASSWORD" -alias "$SYRIUS_KEY_ALIAS" | grep -E "SHA256:" | sed 's/^ */EMPREINTE /'
          else
            echo "::warning::Aucune clé de signature : APK de test (refusé par Google Play)."
          fi

      - name: Compatibilité Google Play (pages mémoire 16 Ko, Android 15+)
        run: |
          mkdir -p "$RUNNER_TEMP/so" && unzip -q -o Syrius.apk 'lib/*' -d "$RUNNER_TEMP/so"
          bad=0
          for f in $(find "$RUNNER_TEMP/so" -name '*.so' | sort); do
            align=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            ok=yes
            for a in $align; do [ $((a)) -ge 16384 ] || ok=no; done
            echo "$ok  $(basename "$f")  $align"
            [ "$ok" = yes ] || bad=1
          done
          ZA=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)zipalign
          "$ZA" -c -P 16 4 Syrius.apk && echo "zipalign 16 Ko : OK" || bad=1
          if [ "$bad" = 1 ]; then echo "::error::Bibliothèque non compatible 16 Ko (Google Play la refusera)"; exit 1; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Syrius-apk
          path: |
            Syrius.apk
            Syrius.aab
            Syrius.apk.sha256

  publish:
    # Publication téléchargeable seulement depuis la branche principale
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Syrius-apk
      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --target "$GITHUB_SHA" --title "Application Android Syrius" \
              --notes "Télécharge **Syrius.apk** depuis ton téléphone Android et ouvre-le pour l'installer."
          gh release upload android-latest Syrius.apk Syrius.aab Syrius.apk.sha256 --clobber
