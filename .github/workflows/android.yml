# Construit l'application Android de Syrius et la publie dans « Releases ».
# Actions officielles, épinglées par empreinte (commit) pour éviter toute substitution.
name: Application Android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.11.1"

      - name: Clé de signature (optionnelle)
        env:
          KEYSTORE_B64: ${{ secrets.SYRIUS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/syrius.jks"
            echo "SYRIUS_KEYSTORE_FILE=$RUNNER_TEMP/syrius.jks" >> "$GITHUB_ENV"
          fi

      - name: Construire l'APK
        working-directory: android
        env:
          SYRIUS_URL: ${{ vars.SYRIUS_URL }}
          SYRIUS_VERSION_CODE: ${{ github.run_number }}
          SYRIUS_KEYSTORE_PASSWORD: ${{ secrets.SYRIUS_KEYSTORE_PASSWORD }}
          SYRIUS_KEY_ALIAS: ${{ secrets.SYRIUS_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk Syrius.apk && sha256sum Syrius.apk | tee Syrius.apk.sha256

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Syrius-apk
          path: |
            Syrius.apk
            Syrius.apk.sha256

  publish:
    # Publication téléchargeable seulement depuis la branche principale
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Syrius-apk
      - name: Publier dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --target "$GITHUB_SHA" --title "Application Android Syrius" \
              --notes "Télécharge **Syrius.apk** depuis ton téléphone Android et ouvre-le pour l'installer."
          gh release upload android-latest Syrius.apk Syrius.apk.sha256 --clobber
