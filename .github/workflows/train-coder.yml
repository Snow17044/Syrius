# Entraîne la petite IA programmeuse d'Aurora (LoRA) sur les exemples VÉRIFIÉS, SEULEMENT s'il y en a assez,
# puis la mesure sur le banc d'essai. Rien n'est publié sans bon score : le résultat reste un simple fichier à consulter.
name: Entraîner l'IA programmeuse

on:
  workflow_dispatch:
    inputs:
      model:
        description: "IA libre de départ pour le code"
        default: "Qwen/Qwen2.5-Coder-0.5B-Instruct"
      minutes:
        description: "Budget de temps d'entraînement (minutes)"
        default: "240"
  schedule:
    - cron: "17 3 * * 0"  # chaque dimanche

permissions:
  contents: write
  id-token: write

jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      SYRIUS_URL: ${{ vars.SYRIUS_URL || 'https://syriusprojet1.vercel.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Assez d'exemples ?
        id: check
        run: |
          mkdir -p training/data
          gh release download coder-data --pattern coder.jsonl --pattern real.jsonl --dir training/data --clobber || true
          # les vrais changements que tu as acceptés comptent triple
          if [ -f training/data/real.jsonl ]; then cat training/data/real.jsonl training/data/real.jsonl training/data/real.jsonl >> training/data/coder.jsonl; fi
          n=$( [ -f training/data/coder.jsonl ] && wc -l < training/data/coder.jsonl || echo 0 )
          echo "Exemples vérifiés : $n (minimum 300)"
          if [ "$n" -ge 300 ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi
      - name: Débats d'Aurora (10 % au plus, le code reste la priorité)
        if: steps.check.outputs.go == 'true'
        run: python3 training/debate_data.py training/data/coder.jsonl
      - name: Outils
        if: steps.check.outputs.go == 'true'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r training/requirements.txt pytest
      - name: Score AVANT entraînement (modèle de départ)
        if: steps.check.outputs.go == 'true'
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          mkdir -p build
          .venv/bin/python -m coder.bench_run local "${{ inputs.model || 'Qwen/Qwen2.5-Coder-0.5B-Instruct' }}" 31 | tee build/bench-avant.json
      - name: Entraînement
        if: steps.check.outputs.go == 'true'
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          .venv/bin/python training/train.py --coder --model "${{ inputs.model || 'Qwen/Qwen2.5-Coder-0.5B-Instruct' }}" \
            --data training/data/coder.jsonl --max-len 2048 --epochs 3 --minutes "${{ inputs.minutes || '240' }}" --out build/coder
      - name: Banc d'essai (bugs réels, tests exécutés)
        id: bench
        if: steps.check.outputs.go == 'true'
        run: .venv/bin/python -m coder.bench_run local build/coder 31 | tee build/bench-apres.json
          if .venv/bin/python -m coder.compare build/bench-avant.json build/bench-apres.json | tee build/verdict.txt; then
            echo "better=true" >> "$GITHUB_OUTPUT"; else echo "better=false" >> "$GITHUB_OUTPUT"; fi
          { echo "## IA programmeuse"; cat build/verdict.txt; } >> "$GITHUB_STEP_SUMMARY"
          gh release upload coder-data build/bench-apres.json build/verdict.txt --clobber || true
      - name: Garder le modèle SEULEMENT s'il est meilleur
        if: steps.check.outputs.go == 'true' && steps.bench.outputs.better == 'true'
        run: |
          gh release view coder-model >/dev/null 2>&1 || gh release create coder-model --title "IA programmeuse (modèle)" \
            --notes "Dernier modèle ayant battu son point de départ sur le banc d'essai." --prerelease
          tar -C build/coder -czf build/coder-model.tgz .
          gh release upload coder-model build/coder-model.tgz build/bench-apres.json build/verdict.txt --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.check.outputs.go == 'true'
        with:
          name: coder-modele
          path: build/
          retention-days: 30
