# Lance Syrius 24h/24 :  docker compose up -d --build
services:
  syrius:
    build: .
    restart: unless-stopped        # redémarre tout seul (panne, reboot du serveur…)
    env_file: .env
    environment:
      SYRIUS_OLLAMA_URL: http://ollama:11434   # IA locale (en plus de Groq/Gemini si configurés)
    volumes:
      - syrius-data:/data          # discussions, mémoire, réglages
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on: [ollama]
    # Pas de "ports:" : Syrius n'est joignable que via Caddy (HTTPS).

  ollama:                          # le cerveau : IA locale, gratuite, privée
    image: ollama/ollama:0.40.12   # version fixée, publiée depuis plus de 2 semaines
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: "-1"      # le modèle reste chargé en mémoire
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-models:/root/.ollama
    # Pas de "ports:" : l'API Ollama n'a pas de mot de passe, elle reste interne.
    # Carte graphique NVIDIA ? Décommente les 6 lignes ci-dessous (voir README).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

  ollama-pull:                     # télécharge le modèle au premier démarrage, puis s'arrête
    image: ollama/ollama:0.40.12
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
      SYRIUS_OLLAMA_MODEL: ${SYRIUS_OLLAMA_MODEL:-qwen3:8b}
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull \"$$SYRIUS_OLLAMA_MODEL\""]
    depends_on: [ollama]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SYRIUS_DOMAIN: ${SYRIUS_DOMAIN:?Indique SYRIUS_DOMAIN dans .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [syrius]

volumes:
  syrius-data:
  ollama-models:
  caddy-data:
  caddy-config:
